name: Mutation testing

# Stryker mutates the timeline core (the `mutate` list in stryker.config.json)
# and runs the core + property tests against every mutant. Slow (tens of
# minutes), so it is manual or weekly — never a PR check. Read the report in
# the uploaded artifact; AGENTS.md → Development explains how to act on a
# surviving mutant.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC

jobs:
  mutation:
    name: Stryker (core)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      # No incremental file is restored, so every run is a full run: the
      # command runner reports no per-test coverage, so an incremental run
      # could not tell that a new test now covers an old survivor.
      - name: Run Stryker
        run: npm run mutation

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: warn
